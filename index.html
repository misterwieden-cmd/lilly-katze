<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08060f">
<title>Lilly Kommandozentrale</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#08060f; --bg2:#120d22; --linie:#2a1f45; --text:#f2ecff; --dim:#9d8fc4;
    --pink:#ff5fa2; --cyan:#43e8ff; --lila:#8b5cf6; --gruen:#3ddc97; --rot:#ff5470;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:radial-gradient(120% 80% at 50% 0%,#1b1233 0%,var(--bg) 60%);
    color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden; touch-action:manipulation;
    padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  }
  header{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--linie);}
  header h1{font-size:15px; margin:0; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:600;}
  #status{margin-left:auto; font-size:12px; letter-spacing:.1em; color:var(--cyan); font-variant-numeric:tabular-nums;}
  #status.fehler{color:var(--rot);} #status.ok{color:var(--gruen);}
  .stufe{display:flex; flex:1; min-height:0; align-items:center; justify-content:center; position:relative;}
  #buehne{position:relative; width:min(88vw,340px); aspect-ratio:1/1;}
  #strahlen{position:absolute; inset:0; width:100%; height:100%;}
  #kopf{position:absolute; inset:12%; width:76%; height:76%; overflow:visible;}
  #kopf .fell{fill:#2b2140; stroke:#4b3a72; stroke-width:1.5;}
  #kopf .ohr{fill:#3a2c57; stroke:#5b4788; stroke-width:1.5; transform-origin:center; transition:transform .18s ease;}
  #kopf .ohrin{fill:#ff8fc0; opacity:.55;}
  #kopf .auge{fill:#0d0a17; stroke:#5b4788; stroke-width:1.2;}
  #kopf .pupille{fill:var(--cyan); transition:fill .25s ease;}
  #kopf .nase{fill:var(--pink);}
  #kopf .mund{fill:none; stroke:#6b5696; stroke-width:2.2; stroke-linecap:round;}
  #kopf .bart{stroke:#6b5696; stroke-width:1.4; stroke-linecap:round; opacity:.8;}
  #kopf.blinzeln .augenlid{opacity:1;}
  #kopf .augenlid{fill:#2b2140; opacity:0; transition:opacity .1s;}
  #kopf.lauschen .ohr{transform:scale(1.06);}
  #kopf.lauschen .pupille{fill:var(--pink);}
  #kopf.denkt .pupille{fill:var(--lila);}
  #kopf.spricht .mund{stroke:var(--pink);}
  #kopf.fehler .pupille{fill:var(--rot);}
  .puls{animation:puls 1.1s ease-in-out infinite;}
  @keyframes puls{0%,100%{opacity:.55;}50%{opacity:1;}}
  #verlauf{flex:0 0 auto; max-height:26vh; overflow-y:auto; padding:6px 14px 10px; display:flex; flex-direction:column; gap:8px; scrollbar-width:thin;}
  .blase{max-width:88%; padding:9px 12px; border-radius:14px; font-size:14.5px; white-space:pre-wrap; word-break:break-word; animation:auf .18s ease;}
  @keyframes auf{from{opacity:0; transform:translateY(4px);}to{opacity:1;}}
  .blase.ich{align-self:flex-end; background:linear-gradient(135deg,#3a2a63,#4a2f6e); border:1px solid var(--linie);}
  .blase.lilly{align-self:flex-start; background:#160f2a; border:1px solid var(--linie); color:#ffe9f5;}
  .blase.meta{align-self:center; font-size:11.5px; color:var(--dim); letter-spacing:.06em; background:none; border:none;}
  #steuer{display:flex; align-items:center; gap:12px; padding:12px 16px calc(14px + var(--safe-b)); border-top:1px solid var(--linie); background:#0b0817;}
  #ptt{
    flex:1; min-height:60px; border-radius:18px; border:1px solid #6a4bb0; cursor:pointer;
    background:linear-gradient(135deg,#5b2fa8,#a13a86); color:#fff; font-size:17px; font-weight:700; letter-spacing:.06em;
    display:flex; align-items:center; justify-content:center; gap:10px; touch-action:none; user-select:none;
    box-shadow:0 8px 26px -10px #a13a86;
  }
  #ptt:active,#ptt.aktiv{background:linear-gradient(135deg,#c23a7f,#ff5fa2); transform:translateY(1px);}
  #ptt[disabled]{opacity:.45; box-shadow:none;}
  .knopf{min-width:56px; min-height:56px; border-radius:16px; border:1px solid var(--linie); background:#160f2a; color:var(--text); font-size:12px; font-weight:600; letter-spacing:.05em;}
  .knopf.on{border-color:var(--gruen); color:var(--gruen);}
  #modus.aus{color:var(--dim);}
  #leiste{display:flex; gap:8px; padding:10px 16px 2px; overflow-x:auto;}
  #leiste .knopf{min-width:0; padding:0 13px; min-height:44px; font-size:12px; flex:none;}
  #leiste .knopf.an{border-color:var(--gruen); color:var(--gruen);}
  #leiste{display:flex; gap:8px; padding:10px 16px 2px; overflow-x:auto;}
  #leiste .knopf{min-width:0; padding:0 13px; min-height:44px; font-size:12px; flex:none;}
  #leiste .knopf.an{border-color:var(--gruen); color:var(--gruen);}
  #tippzeile{display:flex; gap:10px; padding:10px 16px 0;}
  #tippfeld{flex:1; min-height:50px; border-radius:14px; border:1px solid var(--linie); background:#120d22; color:var(--text); padding:0 14px; font-size:16px; font-family:inherit;}
  #tippfeld::placeholder{color:#7d6ea6;}
  #senden{min-width:96px;}
  @media (max-height:620px){ #verlauf{max-height:20vh;} #buehne{width:min(70vw,240px);} }
  @media (prefers-reduced-motion:reduce){ .puls{animation:none;} *{transition:none !important;} }
</style>
</head>
<body>
<header>
  <h1>Lilly</h1>
  <div id="status">BEREIT</div>
</header>

<div id="leiste">
  <button class="knopf" id="basis" title="Kommandobasis-Uebersicht">BASIS</button>
  <button class="knopf" id="stimme" title="Antworten vorlesen">STIMME AUS</button>
  <button class="knopf" id="hud" title="Dashboard der Kommandobasis">HUD</button>
  <button class="knopf" id="zahnrad" title="Einstellungen">SETUP</button>
</div>

<div class="stufe">
  <div id="buehne">
    <canvas id="strahlen" width="600" height="600" aria-hidden="true"></canvas>
    <svg id="kopf" viewBox="0 0 200 200" role="img" aria-label="Katzenkopf">
      <path class="ohr" d="M56 74 L40 26 L86 52 Z"/><path class="ohr" d="M144 74 L160 26 L114 52 Z"/>
      <path class="ohrin" d="M60 68 L49 38 L80 54 Z"/><path class="ohrin" d="M140 68 L151 38 L120 54 Z"/>
      <ellipse class="fell" cx="100" cy="108" rx="62" ry="56"/>
      <circle class="auge" cx="78" cy="100" r="15"/><circle class="auge" cx="122" cy="100" r="15"/>
      <circle class="pupille" cx="78" cy="100" r="6.5"/><circle class="pupille" cx="122" cy="100" r="6.5"/>
      <rect class="augenlid" x="62" y="88" width="32" height="24" rx="10"/>
      <rect class="augenlid" x="106" y="88" width="32" height="24" rx="10"/>
      <path class="nase" d="M100 116 l7 6 l-7 6 l-7 -6 Z"/>
      <path class="mund" id="mund" d="M100 128 q-10 10 -20 2 M100 128 q10 10 20 2"/>
      <path class="bart" d="M74 122 L44 116 M74 130 L44 132 M126 122 L156 116 M126 130 L156 132"/>
    </svg>
  </div>
</div>

<div id="verlauf" aria-live="polite"></div>

<div id="tippzeile">
  <input id="tippfeld" type="text" placeholder="Tippen statt sprechen ..." enterkeyhint="send" autocomplete="off">
  <button class="knopf" id="senden">SENDEN</button>
</div>

<div id="steuer">
  <button class="knopf" id="modus" title="Modus umschalten">FAST</button>
  <button id="ptt" disabled>HALTEN &amp; SPRECHEN</button>

</div>

<script>
(function(){
  'use strict';
  var LS = { url:'lilly_relay', tok:'lilly_relay_tok', key:'lilly_gkey' };
  var $ = function(id){ return document.getElementById(id); };
  var elStatus = $('status'), elVerlauf = $('verlauf'), elKopf = $('kopf'), elPtt = $('ptt');
  var elModus = $('modus'), elZahnrad = $('zahnrad'), elCanvas = $('strahlen');
  var ctx = elCanvas.getContext('2d');
  var S = {
    ws:null, wsOk:false, wartend:false, modus:'fast', verlauf:[],
    pegel:0, ziel:0, serverPegel:0, serverPegelZeit:0, zustand:'idle',
    audio:null, analyser:null, mic:null, worklet:null, rec:null, erkennt:null,
    laeuft:true, blinzelTimer:0
  };

  function statusText(t, klasse){ elStatus.textContent = t; elStatus.className = klasse || ''; }
  function setZustand(z){
    S.zustand = z;
    elKopf.className.baseVal = z === 'listening' ? 'lauschen'
      : z === 'thinking' ? 'denkt puls' : z === 'speaking' ? 'spricht'
      : z === 'error' ? 'fehler' : '';
  }
  function blase(wer, text){
    var d = document.createElement('div');
    d.className = 'blase ' + wer; d.textContent = text;
    elVerlauf.appendChild(d); elVerlauf.scrollTop = elVerlauf.scrollHeight;
    return d;
  }
  function meta(text){ blase('meta', text); }
  function basis(){
    var u = (localStorage.getItem(LS.url) || '').trim().replace(/\/+$/,'');
    var t = (localStorage.getItem(LS.tok) || '').trim();
    return { url:u, tok:t, fertig: !!(u && t) };
  }
  function wsUrl(u){ return u.replace(/^http/i,'ws').replace(/\/+$/,'') + '/ws?token=' + encodeURIComponent(basis().tok); }

  function zeigeBereit(){
    elPtt.disabled = !basis().fertig;
    if(!basis().fertig){ statusText('SETUP NÖTIG','fehler'); }
    else if(!S.wsOk){ statusText('VERBINDE…'); }
  }

  function holeTunnelAdresse(){
    fetch('relay.txt?t=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.ok ? r.text() : ''; }).then(function(neu){
      neu = (neu || '').trim();
      if(!/^https?:\/\//.test(neu)) return;
      if(neu !== localStorage.getItem(LS.url)){
        localStorage.setItem(LS.url, neu);
        meta('Tunnel-Adresse aktualisiert');
        if(basis().fertig) verbinde();
      }
    }).catch(function(){});
  }

  function verbinde(){
    if(S.ws){ try{ S.ws.close(); }catch(e){} S.ws = null; }
    S.wsOk = false;
    var b = basis();
    if(!b.fertig){ zeigeBereit(); return; }
    var ws;
    try{ ws = new WebSocket(wsUrl(b.url)); }catch(e){ S.wsOk = false; zeigeBereit(); return; }
    S.ws = ws;
    var auf = setTimeout(function(){ if(ws.readyState !== 1){ try{ ws.close(); }catch(e){} } }, 6000);
    ws.onopen = function(){ clearTimeout(auf); S.wsOk = true; statusText('VERBUNDEN','ok'); zeigeBereit(); };
    ws.onclose = function(){ clearTimeout(auf); if(S.ws === ws){ S.wsOk = false; S.ws = null; zeigeBereit(); erneutVersuchen(); } };
    ws.onerror = function(){ S.wsOk = false; };
    ws.onmessage = function(ev){
      if(typeof ev.data !== 'string') return;
      var m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
      if(m.type === 'ready'){ statusText('VERBUNDEN','ok'); }
      else if(m.type === 'state'){ setZustand(m.value); if(m.value === 'thinking') statusText('DENKT…'); else if(m.value === 'listening') statusText('HÖRT ZU'); }
      else if(m.type === 'level'){ S.serverPegel = Math.max(m.rms || 0, (m.peak || 0) * 0.5); S.serverPegelZeit = performance.now(); }
      else if(m.type === 'answer'){ S.wartend = false; blase('lilly', m.reply); merken('assistant', m.reply); sprich(m.reply); statusText('BEREIT','ok'); setTimeout(function(){ setZustand('idle'); }, 900); }
      else if(m.type === 'transcript_final'){ if(m.text){ blase('ich', m.text); merken('user', m.text); } }
      else if(m.type === 'pong'){}
      else if(m.type === 'error'){ statusText('FEHLER: ' + (m.message||''), 'fehler'); blase('meta', 'Fehler: ' + (m.message||'')); }
    };
  }

  var tunnelVersuche = 0;
  function erneutVersuchen(){
    if(tunnelVersuche++ > 8) return;
    setTimeout(function(){
      holeTunnelAdresse();
  setInterval(holeTunnelAdresse, 60000);
      setTimeout(function(){ if(!S.wsOk && basis().fertig) verbinde(); }, 2500);
    }, 2500);
  }

  function merken(rolle, text){
    S.verlauf.push({ role:rolle, content:text });
    if(S.verlauf.length > 12) S.verlauf = S.verlauf.slice(-12);
  }

  function frage(text){
    text = (text || '').trim();
    if(!text || S.wartend) return;
    blase('ich', text);
    merken('user', text);
    S.wartend = true;
    setZustand('thinking');
    if(S.wsOk && S.ws && S.ws.readyState === 1){
      S.ws.send(JSON.stringify({ type:'text', text:text, mode:S.modus, history:S.verlauf }));
      return;
    }
    httpFrage(text);
  }

  function httpFrage(text){
    var b = basis();
    if(!b.fertig){ S.wartend = false; statusText('SETUP NÖTIG','fehler'); return; }
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var abbruch = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 45000);
    fetch(b.url + '/cat', {
      method:'POST', signal: ctrl ? ctrl.signal : undefined,
      headers:{ 'Content-Type':'application/json', 'X-Cat-Token': b.tok },
      body: JSON.stringify({ text:text, mode:S.modus, history:S.verlauf })
    }).then(function(r){ return r.json(); }).then(function(j){
      if(!j.job) throw new Error(j.error || 'kein Job');
      var versuche = 0;
      var tick = setInterval(function(){
        versuche++;
        fetch(b.url + '/answer?id=' + j.job, { cache:'no-store' }).then(function(r2){ return r2.json(); }).then(function(a){
          if(a.status === 'done'){
            clearInterval(tick); clearTimeout(abbruch); S.wartend = false;
            blase('lilly', a.reply); merken('assistant', a.reply); sprich(a.reply);
            statusText('BEREIT','ok'); setZustand('idle');
          } else if(versuche > 90){
            clearInterval(tick); clearTimeout(abbruch); S.wartend = false;
            statusText('ZEITÜBERSCHREITUNG','fehler'); setZustand('error');
          }
        }).catch(function(){});
      }, 700);
    }).catch(function(e){
      clearTimeout(abbruch); S.wartend = false;
      statusText('FEHLER','fehler'); blase('meta', 'Verbindung: ' + (e && e.message ? e.message : 'unbekannt')); erneutVersuchen();
    });
  }

  var WORKLET = [
    "class PCMTap extends AudioWorkletProcessor{",
    "  process(inputs){ const ch = inputs[0] && inputs[0][0]; if(ch && ch.length){ this.port.postMessage(ch.slice(0)); } return true; }",
    "}",
    "registerProcessor('pcm-tap', PCMTap);"
  ].join('\n');

  function mikrofonStarten(){
    if(S.mic) return Promise.resolve(S.mic);
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      return Promise.reject(new Error('kein Mikrofon-API'));
    }
    return navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } })
      .then(function(stream){
        S.mic = stream;
        S.audio = new (window.AudioContext || window.webkitAudioContext)();
        var quelle = S.audio.createMediaStreamSource(stream);
        S.analyser = S.audio.createAnalyser();
        S.analyser.fftSize = 1024; S.analyser.smoothingTimeConstant = 0.75;
        quelle.connect(S.analyser);
        if(S.audio.audioWorklet && window.AudioWorkletNode && S.audio.sampleRate >= 8000){
          var blob = new Blob([WORKLET], { type:'application/javascript' });
          var werkUrl = URL.createObjectURL(blob);
          S.audio.audioWorklet.addModule(werkUrl).then(function(){
            S.worklet = new AudioWorkletNode(S.audio, 'pcm-tap');
            quelle.connect(S.worklet);
            S.worklet.port.onmessage = function(ev){ pcmSenden(ev.data); };
          }).catch(function(){ S.worklet = null; });
        }
        return stream;
      });
  }
  function pcmSenden(floats){
    if(!S.wsOk || !S.ws || S.ws.readyState !== 1 || !S.audio) return;
    var rate = S.audio.sampleRate, verh = rate / 16000;
    if(verh < 1) return;
    var ziel = Math.floor(floats.length / verh);
    if(ziel < 32) return;
    var puffer = new Int16Array(ziel);
    for(var i = 0; i < ziel; i++){
      var von = Math.floor(i * verh), bis = Math.min(floats.length, Math.floor((i+1) * verh));
      var summe = 0, n = 0;
      for(var k = von; k < bis; k++){ summe += floats[k]; n++; }
      var wert = n ? summe / n : 0;
      puffer[i] = Math.max(-32768, Math.min(32767, Math.round(wert * 32767)));
    }
    try{ S.ws.send(puffer.buffer); }catch(e){}
  }

  function spracherkennungBauen(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ S.erkennt = null; return null; }
    var r = new SR();
    r.lang = 'de-DE'; r.continuous = false; r.interimResults = true; r.maxAlternatives = 1;
    r.onresult = function(ev){
      var text = '', fertig = false;
      for(var i = ev.resultIndex; i < ev.results.length; i++){
        text += ev.results[i][0].transcript;
        if(ev.results[i].isFinal) fertig = true;
      }
      text = text.trim();
      if(!text) return;
      if(fertig){ statusText('VERARBEITE…'); S.wartend = false; frage(text); }
      else { statusText('„' + text.slice(-28) + '“'); }
    };
    r.onerror = function(ev){
      if(ev.error !== 'aborted' && ev.error !== 'no-speech'){ statusText('SPRACHE: ' + ev.error, 'fehler'); }
    };
    r.onend = function(){ if(S.zustand === 'listening') setZustand('idle'); };
    S.erkennt = r;
    return r;
  }

  function sprichStart(){
    if(!basis().fertig){ statusText('SETUP NÖTIG','fehler'); return; }
    elPtt.classList.add('aktiv');
    if(navigator.vibrate) navigator.vibrate(12);
    mikrofonStarten().then(function(){
      setZustand('listening'); statusText('HÖRT ZU');
      if(S.wsOk && S.ws && S.ws.readyState === 1){
        S.ws.send(JSON.stringify({ type:'start', format:'pcm16', rate:16000 }));
      }
      var r = S.erkennt || spracherkennungBauen();
      if(r){ try{ r.start(); }catch(e){} } else { statusText('KEIN SPRACH-API – BITTE TIPPEN','fehler'); if(elTipp){ elTipp.focus(); } }
    }).catch(function(e){
      elPtt.classList.remove('aktiv');
      statusText('MIKRO: ' + (e.message || 'Fehler'), 'fehler');
      setZustand('error');
    });
  }
  function sprichStope(){
    elPtt.classList.remove('aktiv');
    if(navigator.vibrate) navigator.vibrate(8);
    if(S.wsOk && S.ws && S.ws.readyState === 1){
      S.ws.send(JSON.stringify({ type:'stop' }));
    }
    if(S.erkennt){ try{ S.erkennt.stop(); }catch(e){} }
    if(S.zustand === 'listening') setZustand('idle');
    if(S.mic){ S.mic.getTracks().forEach(function(t){ t.stop(); }); S.mic = null; }
    if(S.audio){ try{ S.audio.close(); }catch(e){} S.audio = null; S.analyser = null; S.worklet = null; }
  }

  function pegelLesen(){
    var jetzt = performance.now();
    if(S.analyser){
      var daten = new Uint8Array(S.analyser.fftSize);
      S.analyser.getByteTimeDomainData(daten);
      var summe = 0;
      for(var i = 0; i < daten.length; i++){ var d = (daten[i] - 128) / 128; summe += d * d; }
      var rms = Math.sqrt(summe / daten.length);
      S.ziel = Math.min(1, rms * 3.4);
    } else if(jetzt - S.serverPegelZeit < 500){
      S.ziel = Math.min(1, S.serverPegel * 3.2);
    } else {
      S.ziel = S.zustand === 'speaking' ? 0.34 + 0.22 * Math.sin(jetzt / 190) : 0;
    }
    S.pegel += (S.ziel - S.pegel) * (S.ziel > S.pegel ? 0.45 : 0.12);
    return S.pegel;
  }

  function zeichnen(){
    if(!S.laeuft) return;
    var b = elCanvas.width, m = b / 2, pegel = pegelLesen();
    ctx.clearRect(0, 0, b, b);
    var ruhig = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var takt = performance.now() / 1000;
    var farbe = S.zustand === 'speaking' ? '255,95,162' : S.zustand === 'thinking' ? '139,92,246'
      : S.zustand === 'error' ? '255,84,112' : '67,232,255';
    var anzahl = 64, grund = m * 0.62;
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    for(var i = 0; i < anzahl; i++){
      var winkel = (i / anzahl) * Math.PI * 2 - Math.PI / 2;
      var welle = ruhig ? 0.5 : 0.5 + 0.5 * Math.sin(takt * 2.2 + i * 0.42);
      var laenge = m * (0.05 + 0.3 * pegel * welle);
      var aussen = grund + laenge, innen = grund - laenge * 0.55;
      ctx.strokeStyle = 'rgba(' + farbe + ',' + (0.16 + 0.78 * pegel).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(m + Math.cos(winkel) * innen, m + Math.sin(winkel) * innen);
      ctx.lineTo(m + Math.cos(winkel) * aussen, m + Math.sin(winkel) * aussen);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(' + farbe + ',' + (0.1 + 0.35 * pegel).toFixed(3) + ')';
    ctx.lineWidth = 1.5;
    ctx.arc(m, m, grund * (1 + 0.06 * pegel), 0, Math.PI * 2);
    ctx.stroke();
    elKopf.style.transform = 'scale(' + (1 + 0.05 * pegel).toFixed(3) + ')';
    var mund = document.getElementById('mund');
    if(mund){
      var auf = S.zustand === 'speaking' ? 6 + 16 * pegel : 3 + 5 * pegel;
      mund.setAttribute('d', 'M100 128 q-10 ' + auf.toFixed(1) + ' -20 ' + (auf * 0.2).toFixed(1)
        + ' M100 128 q10 ' + auf.toFixed(1) + ' 20 ' + (auf * 0.2).toFixed(1));
    }
    var jetzt = performance.now();
    if(S.zustand !== 'listening' && jetzt > S.blinzelTimer){
      S.blinzelTimer = jetzt + 2600 + Math.random() * 3200;
      elKopf.classList.add('blinzeln');
      setTimeout(function(){ elKopf.classList.remove('blinzeln'); }, 130);
    }
    requestAnimationFrame(zeichnen);
  }

  var elTipp = $('tippfeld'), elSenden = $('senden');
  function sendeTipp(){ var t = elTipp.value.trim(); if(!t) return; elTipp.value=''; frage(t); }
  elSenden.addEventListener('click', sendeTipp);
  elTipp.addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); sendeTipp(); } });

  elPtt.addEventListener('pointerdown', function(ev){ ev.preventDefault(); sprichStart(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(a){
    elPtt.addEventListener(a, function(ev){ if(elPtt.classList.contains('aktiv')){ ev.preventDefault(); sprichStope(); } });
  });
  elModus.addEventListener('click', function(){
    S.modus = S.modus === 'fast' ? 'deep' : 'fast';
    elModus.textContent = S.modus.toUpperCase();
    elModus.classList.toggle('aus', S.modus === 'fast');
    statusText('MODUS ' + S.modus.toUpperCase());
  });
  var elStimme = $('stimme'), elBasis = $('basis');
  var stimmeAn = (localStorage.getItem('lilly_stimme') || 'aus') === 'an';
  function stimmeAnzeigen(){ if(elStimme){ elStimme.textContent = stimmeAn ? 'STIMME AN' : 'STIMME AUS'; elStimme.classList.toggle('an', stimmeAn); } }
  function sprich(text){
    if(!stimmeAn || !window.speechSynthesis || !text) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text).slice(0, 400));
      u.lang = 'de-DE'; u.rate = 1.02; u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  if(elStimme){
    stimmeAnzeigen();
    elStimme.addEventListener('click', function(){
      stimmeAn = !stimmeAn;
      localStorage.setItem('lilly_stimme', stimmeAn ? 'an' : 'aus');
      stimmeAnzeigen();
      if(stimmeAn){ sprich('Stimme ist an, miau.'); } else if(window.speechSynthesis){ window.speechSynthesis.cancel(); }
    });
  }
  if(elBasis){
    elBasis.addEventListener('click', function(){
      var b = basis();
      if(!b.fertig){ statusText('SETUP NÖTIG','fehler'); return; }
      window.open(b.url + '/basis/' + encodeURIComponent(b.tok), '_blank');
    });
  }
  var elHud = $('hud');
  if(elHud){ elHud.addEventListener('click', function(){
    var b = basis();
    if(!b.fertig){ statusText('SETUP NÖTIG','fehler'); return; }
    window.open(b.url + '/hud/' + encodeURIComponent(b.tok), '_blank');
  }); }
  elZahnrad.addEventListener('click', function(){
    var b = basis();
    var u = prompt('Brücken-Adresse (Tunnel-URL):', b.url || '');
    if(u === null) return;
    var t = prompt('Brücken-Token:', b.tok || '');
    if(t === null) return;
    u = u.trim().replace(/\/+$/,''); t = t.trim();
    if(!u){ localStorage.removeItem(LS.url); localStorage.removeItem(LS.tok); }
    else { localStorage.setItem(LS.url, u); localStorage.setItem(LS.tok, t); }
    statusText('GESPEICHERT','ok');
    zeigeBereit(); if(basis().fertig) verbinde();
  });

  document.addEventListener('visibilitychange', function(){ if(!document.hidden && basis().fertig && !S.wsOk) verbinde(); });
  window.addEventListener('beforeunload', function(){ S.laeuft = false; try{ if(S.ws) S.ws.close(); }catch(e){} });

  holeTunnelAdresse();
  setInterval(holeTunnelAdresse, 60000);
  zeigeBereit();
  if(basis().fertig) verbinde(); else meta('Setup: Brücken-Adresse und Token eintragen.');
  requestAnimationFrame(zeichnen);
})();
</script>
</body>
</html>
